[build]
command = "pnpm build"
ignore = "git log -1 --pretty=%B | grep skipci"

[build.environment]
NODE_VERSION = "24.20.0"

[template.environment]
NUXT_STEAM_KEY = "your Steam API key"
NUXT_CACHE_TIME = "request cache time (seconds)"
NUXT_PUBLIC_ORIGIN = "public site origin, for example https://card.example.com"
